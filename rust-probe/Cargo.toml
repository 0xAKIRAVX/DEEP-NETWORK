[package]
name = "deep-probe"
version = "3.0.0"
edition = "2021"
description = "DEEP NETWORK — multi-threaded TCP/TLS-ClientHello latency prober (std-only, static)"

[[bin]]
name = "deep-probe"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
